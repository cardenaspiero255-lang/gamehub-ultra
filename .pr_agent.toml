# Qodo GitHub reviews suspended indefinitely by repository owner (2026-10-11).
# Prevent all automatic Qodo feedback and do not invite manual Qodo commands.
# This file does NOT revoke the installed GitHub App's permissions: revoke those
# separately at https://github.com/settings/installations for full deactivation.
# Codex and CodeRabbit remain subject to docs/REVIEWERS_NO_CREDITS.md.
[config]
disable_auto_feedback = true
ignore_repositories = ["cardenaspiero255-lang/gamehub-ultra"]
enable_auto_approval = false

[github_app]
pr_commands = []
push_commands = []
handle_push_trigger = false
feedback_on_draft_pr = false
review_commands = []

[review_agent]
enabled = false
publish_output = false
approve_pr_on_self_review = false

[pr_reviewer]
enable_auto_approval = false

[chat_agent]
enabled = false

[checks]
enable_auto_checks_feedback = false

[fixer_agent]
enable = false
enable_auto_fix = false
