# Qodo Free for Open Source — activated by repo owner on 2026-10-11.
# Run reviews only: never auto-approve, merge, apply fixes or rewrite PR descriptions.
# Codex and CodeRabbit remain disabled under docs/REVIEWERS_NO_CREDITS.md.

[github_app]
pr_commands = ["/agentic_review"]
handle_push_trigger = true
push_commands = ["/agentic_review"]
feedback_on_draft_pr = false

[review_agent]
enabled = true
publish_output = true
comments_location_policy = "both"
inline_comments_severity_threshold = 2
approve_pr_on_self_review = false

[pr_reviewer]
require_security_review = true
require_tests_review = true
enable_auto_approval = false

[config]
ignore_repositories = []
disable_auto_feedback = false
enable_auto_approval = false

[chat_agent]
enabled = false

[checks]
enable_auto_checks_feedback = false

[fixer_agent]
enable = false
enable_auto_fix = false
