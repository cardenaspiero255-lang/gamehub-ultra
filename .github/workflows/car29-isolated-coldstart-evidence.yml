name: CAR-29 isolated API35 cold-start evidence
'on':
  push:
    branches: [ci/car29-isolated-coldrestart-proof-20261024]
permissions:
  contents: read
concurrency:
  group: car29-isolated-coldrestart-proof
  cancel-in-progress: false
jobs:
  cold-restart:
    name: Prove real Android cold restart on PR222 exact SHA
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      TARGET_SHA: 10d03684a19daa16d0c5735359c1f9853a91d7ae
      CAR29_PROOF_DIR: build/car29-android-e2e
    steps:
      - name: Check out immutable PR222 code, not evidence workflow branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 10d03684a19daa16d0c5735359c1f9853a91d7ae
          persist-credentials: false
      - name: Verify exact code SHA and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
      - name: Enable KVM and current SDK manager
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bin="$sdk/cmdline-tools/latest/bin"
          if [ ! -x "$bin/sdkmanager" ]; then
            version="$(find "$sdk/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n1)"
            test -n "$version"
            bin="$sdk/cmdline-tools/$version/bin"
          fi
          test -x "$bin/sdkmanager"
          echo "$bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install exact project SDK and Android API 35 runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          missing=()
          test -s "$sdk/platforms/android-36/android.jar" || missing+=("platforms;android-36")
          test -x "$sdk/build-tools/36.0.0/aapt2" || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -gt 0 ]; then sdkmanager "${missing[@]}"; fi
          bash .github/scripts/install-android-runtime-sdk.sh
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Create and boot isolated API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          image="$sdk/system-images/android-35/google_apis/x86_64"
          test -s "$image/system.img"
          test -e "$image/data/empty_data_disk"
          test -x "$sdk/emulator/emulator"
          avd="$HOME/.android/avd/car29-api35.avd"
          mkdir -p "$avd" "$CAR29_PROOF_DIR"
          cat > "$HOME/.android/avd/car29-api35.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$avd
          path.rel=avd/car29-api35.avd
          target=android-35
          EOF
          cat > "$avd/config.ini" <<'EOF'
          AvdId=car29-api35
          PlayStore.enabled=false
          abi.type=x86_64
          disk.dataPartition.size=4G
          hw.audioInput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.lcd.width=1080
          hw.lcd.height=1920
          hw.lcd.density=420
          hw.ramSize=4096
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          tag.id=google_apis
          target=android-35
          vm.heapSize=512
          EOF
          : > "$HOME/.emulator_console_auth_token"
          "$sdk/emulator/emulator" -list-avds | grep -Fxq car29-api35
          adb start-server
          nohup "$sdk/emulator/emulator" -avd car29-api35 -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save \
            -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 4 \
            -camera-back none -camera-front none \
            > "$CAR29_PROOF_DIR/emulator.log" 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          timeout 300 adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb get-state 2>/dev/null)" = device ] && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb devices
      - name: Execute genuine 2-phase instrumentation and verify SHA-bound receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bash scripts/car29-verify-android-e2e.sh 2>&1 | tee "$CAR29_PROOF_DIR/e2e-driver.log"
          python3 - <<'PY'
          import json, os, pathlib
          data=json.loads((pathlib.Path(os.environ["CAR29_PROOF_DIR"])/"CAR29-E2E-receipt.json").read_text())
          assert data["gitSha"]==os.environ["TARGET_SHA"]
          assert data["result"]=="PASS"
          assert data["androidForceStopAndColdStart"] is True
          assert data["persistentSessionReplayAndRollbackVerifiedAfterColdStart"] is True
          assert data["processBeforeForceStopPid"] != data["processAfterColdStartPid"]
          print("CAR29 REAL EMULATOR RESTART VERIFIED")
          PY
      - name: Preserve E2E receipt, logs and JUnit XML
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: car29-coldstart-exact-sha-evidence
          path: |
            build/car29-android-e2e/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Terminate isolated emulator
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${EMULATOR_PID:-}" ]; then kill -KILL "$EMULATOR_PID" 2>/dev/null || true; fi
          adb kill-server >/dev/null 2>&1 || true
