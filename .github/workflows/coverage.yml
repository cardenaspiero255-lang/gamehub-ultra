name: Unit Test Coverage
# Review hardening: coverage always runs; upload is secret-gated and actions are SHA-pinned.

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  actions: read
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAMEHUB_UNIT_TEST_FORKS: "3"
      GAMEHUB_UNIT_TEST_HEAP: "1024m"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages only when missing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          missing=()
          [ -s "$SDK_ROOT/platforms/android-36/android.jar" ] || missing+=("platforms;android-36")
          [ -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ] || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Coverage SDK packages already present; skipping sdkmanager."
            exit 0
          fi
          sdkmanager "${missing[@]}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-disabled: false
          # Android device-validation owns cache writes on normal CI events.
          # Avoid duplicate cache uploads from the parallel coverage workflow.
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Generate debug unit-test coverage
        shell: bash
        run: |
          gradle :app:createDebugUnitTestCoverageReport \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --console=plain \
            --stacktrace

      - name: Verify coverage XML report
        shell: bash
        run: test -s app/build/reports/coverage/test/debug/report.xml

      - name: Enforce local patch coverage
        env:
          PATCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATCH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${PATCH_BASE_SHA:-}"
          head_sha="${PATCH_HEAD_SHA:-$GITHUB_SHA}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$head_sha^")"
          fi
          python3 .github/scripts/local_patch_coverage.py \
            --xml app/build/reports/coverage/test/debug/report.xml \
            --base "$base_sha" \
            --head "$head_sha" \
            --min-patch-line 90

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-coverage-report
          path: app/build/reports/coverage/test/debug/report.xml
          if-no-files-found: error
          compression-level: 1
