name: Unit Test Coverage

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Codecov token
        shell: bash
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::Repository secret CODECOV_TOKEN is missing or unavailable."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Generate debug unit-test coverage
        shell: bash
        run: gradle :app:createDebugUnitTestCoverageReport --build-cache --stacktrace

      - name: Show coverage report files
        shell: bash
        run: find app/build/reports/coverage -type f -maxdepth 8 -print | sort

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: app/build/reports/coverage/test/debug
          flags: unit-tests
          name: gamehub-ultra-unit-tests
          fail_ci_if_error: true
          verbose: true
