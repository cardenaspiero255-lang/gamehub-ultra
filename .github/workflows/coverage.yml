name: Unit Test Coverage
# Review hardening: coverage always runs; upload is secret-gated and actions are SHA-pinned.

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  actions: read
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Codecov token availability
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODECOV_TOKEN is unavailable; coverage will still run, but upload will be skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages only when missing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          missing=()
          [ -s "$SDK_ROOT/platforms/android-36/android.jar" ] || missing+=("platforms;android-36")
          [ -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ] || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Coverage SDK packages already present; skipping sdkmanager."
            exit 0
          fi
          sdkmanager "${missing[@]}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-disabled: false
          # Android device-validation owns cache writes on normal CI events.
          # Avoid duplicate cache uploads from the parallel coverage workflow.
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Generate debug unit-test coverage
        shell: bash
        run: gradle :app:createDebugUnitTestCoverageReport --build-cache --parallel --stacktrace

      - name: Verify coverage XML report
        shell: bash
        run: |
          set -euo pipefail
          find app/build/reports/coverage -type f -maxdepth 8 -print | sort
          test -s app/build/reports/coverage/test/debug/report.xml

      - name: Upload coverage to Codecov
        id: codecov_upload
        if: steps.codecov_token.outputs.available == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: unit-tests
          name: gamehub-ultra-unit-tests
          fail_ci_if_error: true
          verbose: true

      - name: Retry Codecov upload after transient failure
        id: codecov_retry
        if: steps.codecov_token.outputs.available == 'true' && steps.codecov_upload.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: unit-tests
          name: gamehub-ultra-unit-tests-retry
          fail_ci_if_error: true
          verbose: true

      - name: Preserve coverage report when Codecov is unavailable
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-coverage-report
          path: app/build/reports/coverage/test/debug/report.xml
          if-no-files-found: error

      - name: Warn when Codecov upload is externally unavailable
        if: steps.codecov_token.outputs.available == 'true' && steps.codecov_upload.outcome == 'failure' && steps.codecov_retry.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Coverage was generated and preserved, but both Codecov upload attempts failed. This external upload failure does not invalidate the local coverage report."

  metrics:
    name: metrics
    if: always()
    needs:
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Collect CI performance metrics
        env:
          GH_METRICS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ci-performance-metrics.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --token "$GH_METRICS_TOKEN" \
            --history 20 \
            --json-out "$RUNNER_TEMP/ci-performance.json" \
            --summary-out "$RUNNER_TEMP/ci-performance.md"
          cat "$RUNNER_TEMP/ci-performance.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI performance metrics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-ci-metrics-coverage
          path: |
            ${{ runner.temp }}/ci-performance.json
            ${{ runner.temp }}/ci-performance.md
          if-no-files-found: error
