name: Unit Test Coverage
# Review hardening: coverage always runs; upload is secret-gated and actions are SHA-pinned.

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Codecov token availability
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODECOV_TOKEN is unavailable; coverage will still run, but upload will be skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"

      - name: Generate debug unit-test coverage
        shell: bash
        run: gradle :app:createDebugUnitTestCoverageReport --build-cache --stacktrace

      - name: Verify coverage XML report
        shell: bash
        run: |
          set -euo pipefail
          find app/build/reports/coverage -type f -maxdepth 8 -print | sort
          test -s app/build/reports/coverage/test/debug/report.xml

      - name: Upload coverage to Codecov
        if: steps.codecov_token.outputs.available == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: app/build/reports/coverage/test/debug/report.xml
          disable_search: true
          flags: unit-tests
          name: gamehub-ultra-unit-tests
          fail_ci_if_error: true
          verbose: true
