name: Supabase research smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/ultra-research/**"
      - ".github/workflows/supabase-research-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"

      - name: Exercise general knowledge, weather and news
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${SUPABASE_URL%/}/functions/v1/ultra-research"
          smoke() {
            local label="$1"
            local body="$2"
            local out
            out="$(mktemp)"
            code="$(curl --fail-with-body --silent --show-error               --connect-timeout 10 --max-time 45               -o "$out" -w '%{http_code}'               -X POST "$endpoint"               -H "Content-Type: application/json"               -H "apikey: $SUPABASE_PUBLISHABLE_KEY"               --data "$body")"
            test "$code" = "200"
            python3 - "$label" "$out" <<'PY'
import json, sys
label, path = sys.argv[1:3]
with open(path, encoding="utf-8") as f:
    payload = json.load(f)
if payload.get("abstained") is True:
    raise SystemExit(f"{label}: backend abstained: {payload.get('reasonCode') or payload.get('message')}")
if not str(payload.get("displayText") or "").strip():
    raise SystemExit(f"{label}: missing displayText")
if label in {"weather", "news"} and not payload.get("sourceIds"):
    raise SystemExit(f"{label}: missing sources")
print(f"{label}: OK")
PY
            rm -f "$out"
          }

          smoke general '{"query":"Qué es un motor","kind":"GENERAL_KNOWLEDGE","verificationMode":"STRICT","requiresFreshData":false,"correlationId":"smoke-general-001"}'
          smoke weather '{"query":"Clima de hoy en Santiago","kind":"CURRENT_DATA","verificationMode":"STRICT","requiresFreshData":true,"correlationId":"smoke-weather-001"}'
          smoke news '{"query":"Noticias de tecnología de hoy","kind":"CURRENT_DATA","verificationMode":"STRICT","requiresFreshData":true,"correlationId":"smoke-news-001"}'
