name: Ultra Sentinel - Safe Repair Candidates
# Never checkout PR head in this privileged read-only workflow.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: sentinel-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dry-run-patch:
    name: Generate uncommitted fix.patch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted Sentinel engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false
      - name: Generate bounded repair candidates from API data
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # pinned v8 Node 24
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const {analyze}=require(path.resolve('.github/scripts/ultra_sentinel_core.cjs'));
            const {orchestrate,selectRepairTargets}=require(path.resolve('.github/scripts/ultra_sentinel_orchestrator.cjs'));
            const owner=context.repo.owner,repo=context.repo.repo,number=context.issue.number;
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(pr.state!=='open'||pr.head.repo?.full_name!==owner+'/'+repo){
              core.setFailed('Only open same-repository PRs supported');return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:number,per_page:100});
            // Reconstruct Kotlin/Java lexical context from the immutable PR SHA
            // *before* running the detector, not only after finding targets.
            // Read-only bounded data; never checkout/execute PR code.
            const evidenceFiles=files.map(item=>({...item}));
            const languageTargets=evidenceFiles.filter(item=>
              item.status!=='removed'&&
              /^app\/src\/main\/[A-Za-z0-9_./-]+\.(?:kt|java)$/.test(item.filename||'')&&
              !String(item.filename||'').includes('..')).slice(0,24);
            for(let i=0;i<languageTargets.length;i+=4){
              await Promise.all(languageTargets.slice(i,i+4).map(async item=>{
                try{
                  const {data:entry}=await github.rest.repos.getContent({
                    owner,repo,path:item.filename,ref:pr.head.sha
                  });
                  if(entry.type!=='file'||entry.encoding!=='base64'||
                     !Number.isSafeInteger(entry.size)||entry.size>160000||
                     typeof entry.content!=='string')return;
                  const bytes=Buffer.from(entry.content,'base64');
                  if(bytes.length===entry.size&&bytes.length<=160000)
                    item.fullSource=bytes.toString('utf8');
                }catch(error){
                  core.warning('Kotlin/Java source context unavailable ('+
                    (error.status||'API error')+'); findings stay incomplete.');
                }
              }));
            }
            const analysis=analyze(evidenceFiles,{sha:pr.head.sha});
            if(pr.changed_files>files.length){analysis.coverage.partial=true;analysis.verdict='INCOMPLETE';}
            const sources={};
            const targets=selectRepairTargets(analysis.findings,8);
            for(const filename of targets){
              try{
                const {data: entry}=await github.rest.repos.getContent({owner,repo,path:filename,ref:pr.head.sha});
                if(entry.type==='file'&&entry.encoding==='base64'&&entry.size<=240000)
                  sources[filename]=Buffer.from(entry.content,'base64').toString('utf8');
              }catch(error){core.warning('Source read failed: '+filename+' ('+error.status+')');}
            }
            const report=orchestrate({analysis,sources,sha:pr.head.sha,checks:{}});
            const current=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(current.head.sha!==pr.head.sha){core.setFailed('PR changed during scan');return;}
            const dest=path.join(process.env.RUNNER_TEMP,'sentinel-patch');
            fs.mkdirSync(dest,{recursive:true});
            const patches=report.fixer.proposals.map(x=>x.proposal.patch);
            fs.writeFileSync(path.join(dest,'report.json'),JSON.stringify({
              sha:pr.head.sha,pr:number,engine:report.engine,
              coverage:analysis.coverage,verdict:analysis.verdict,
              candidates:report.fixer.proposals.map(x=>({
                filename:x.proposal.filename,rule:x.proposal.rule,
                linesChanged:x.proposal.linesChanged,decision:x.judgement.status,
                test:x.proposal.test
              })),
              approved:false,applied:false,merged:false
            },null,2));
            if(patches.length)fs.writeFileSync(path.join(dest,'fix.patch'),patches.join('\n'));
            await core.summary.addHeading('Ultra Sentinel repair candidates')
              .addRaw('SHA: '+pr.head.sha+'\n\n'+patches.length+' patch(es) proposed. No code was applied.')
              .write();
            if(analysis.coverage.partial)core.warning('Incomplete diff coverage: result requires manual validation.');
      - name: Save advisory patch artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 Node 24
        with:
          name: ultra-sentinel-proposal-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sentinel-patch/
          if-no-files-found: error
          retention-days: 7
