name: Fast Game Benchmark Unit Tests

on:
  pull_request:
    paths:
      - 'scripts/quick_game_benchmark.py'
      - 'scripts/tests/test_quick_game_benchmark.py'
      - '.github/workflows/quick-game-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate no fabricated FPS, thermal, or ping
        run: python -m unittest discover -s scripts/tests -p 'test_quick_game_benchmark.py' -v
