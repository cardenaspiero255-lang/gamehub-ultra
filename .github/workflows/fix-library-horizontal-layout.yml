name: Fix library horizontal layout

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt'
      - '.github/workflows/fix-library-horizontal-layout.yml'

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make library grid adaptive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt')
          text = path.read_text()
          old = 'columns = GridCells.Fixed(4),'
          new = 'columns = GridCells.Adaptive(minSize = 180.dp),'
          if old not in text:
              print('Adaptive layout may already be applied; no source replacement needed.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit layout patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'Use adaptive columns for horizontal library layout'
          git push
