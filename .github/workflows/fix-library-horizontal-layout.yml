name: Fix library horizontal layout

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/ui/theme/GameHubUiTokens.kt'
      - '.github/workflows/fix-library-horizontal-layout.yml'

jobs:
  patch-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/car-32-original-ui-reconstruction

      - name: Apply CAR-32 original UI reconstruction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt')
          text = main_path.read_text(encoding='utf-8')

          def require_replace(source: str, old: str, new: str, label: str) -> str:
              if old not in source:
                  raise SystemExit(f'Missing replacement target: {label}')
              return source.replace(old, new, 1)

          def replace_between(source: str, start_marker: str, end_marker: str, new_block: str, label: str) -> str:
              start = source.find(start_marker)
              if start == -1:
                  raise SystemExit(f'Missing start marker: {label}')
              end = source.find(end_marker, start)
              if end == -1:
                  raise SystemExit(f'Missing end marker: {label}')
              return source[:start] + new_block + source[end:]

          text = require_replace(
              text,
              '''TopAppBar(
                title = { Text("GAMEHUB ULTRA") },
                actions = {
                    TextButton(
                        onClick = {
                            Trace.beginSection("GameHubUltra.Navigation.Settings")
                            try {
                                settingsOpen = !settingsOpen
                            } finally {
                                Trace.endSection()
                            }
                        },
                        modifier = Modifier
                            .testTag("nav_ajustes")
                            .semantics(mergeDescendants = true) {
                                testTagsAsResourceId = true
                                contentDescription = "nav_ajustes"
                            }
                    ) {
                        Text("⚙")
                    }
                }
            )''',
              '''Surface(
                modifier = Modifier.fillMaxWidth(),
                color = MaterialTheme.colorScheme.background
            ) {
                Row(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(horizontal = 12.dp, vertical = 6.dp),
                    horizontalArrangement = Arrangement.SpaceBetween
                ) {
                    Text(
                        "GAMEHUB ULTRA",
                        style = MaterialTheme.typography.titleMedium
                    )
                    TextButton(
                        onClick = {
                            Trace.beginSection("GameHubUltra.Navigation.Settings")
                            try {
                                settingsOpen = !settingsOpen
                            } finally {
                                Trace.endSection()
                            }
                        },
                        modifier = Modifier
                            .testTag("nav_ajustes")
                            .semantics(mergeDescendants = true) {
                                testTagsAsResourceId = true
                                contentDescription = "nav_ajustes"
                            }
                    ) {
                        Text(if (settingsOpen) "Cerrar" else "Ajustes")
                    }
                }
            }''',
              'compact top bar'
          )

          text = require_replace(
              text,
              '''HomeScreen(
                    modifier = Modifier.fillMaxSize(),
                    state = state,''',
              '''HomeScreen(
                    modifier = Modifier.fillMaxSize(),
                    state = state,
                    onOpenLibrary = { selectedTab = 1 },''',
              'home call library action'
          )
          text = require_replace(
              text,
              '''    state: PerformanceState,
    device: DeviceInfo,''',
              '''    state: PerformanceState,
    onOpenLibrary: () -> Unit,
    device: DeviceInfo,''',
              'home signature library action'
          )
          text = require_replace(
              text,
              '''StoreLibrarySummary(
                games = storeGames,
                onOpenLibrary = { /* tab remains available below */ }
            )''',
              '''StoreLibrarySummary(
                games = storeGames,
                onOpenLibrary = onOpenLibrary
            )''',
              'store summary real action'
          )

          header_start = '''@Composable
private fun GameHubStyleHeader(
    selectedProfileName: String
) {'''
          header_end = '''@Composable
private fun TusJuegosShelf('''
          header_new = '''@Composable
private fun GameHubStyleHeader(
    selectedProfileName: String
) {
    Card(modifier = Modifier.fillMaxWidth()) {
        Column(
            modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp),
            verticalArrangement = Arrangement.spacedBy(6.dp)
        ) {
            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween
            ) {
                Column(modifier = Modifier.weight(1f)) {
                    Text(
                        "GAMEHUB ULTRA",
                        style = MaterialTheme.typography.titleLarge,
                        color = MaterialTheme.colorScheme.primary
                    )
                    Text(
                        "PC • STEAM • EPIC • RETRO",
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                }
                Surface(
                    color = MaterialTheme.colorScheme.primaryContainer,
                    shape = MaterialTheme.shapes.small
                ) {
                    Text(
                        selectedProfileName,
                        modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                        style = MaterialTheme.typography.labelMedium
                    )
                }
            }
            Text(
                "Usa Biblioteca para buscar, abrir o fijar juegos. Los botones visibles tienen acción real.",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
        }
    }
}


'''
          text = replace_between(text, header_start, header_end, header_new + header_end, 'compact original header')

          text = require_replace(
              text,
              '''Column(
        modifier = modifier
            .fillMaxSize()
            .padding(12.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    )''',
              '''Column(
        modifier = modifier
            .fillMaxSize()
            .padding(horizontal = 10.dp, vertical = 6.dp),
        verticalArrangement = Arrangement.spacedBy(8.dp)
    )''',
              'library compact padding'
          )
          text = text.replace('columns = GridCells.Adaptive(minSize = 168.dp),', 'columns = GridCells.Adaptive(minSize = 128.dp),', 1)
          text = text.replace('modifier = Modifier.padding(14.dp),\n            verticalArrangement = Arrangement.spacedBy(8.dp)\n        ) {\n            Text(\n                stringResource(R.string.selected_game),', 'modifier = Modifier.padding(10.dp),\n            verticalArrangement = Arrangement.spacedBy(6.dp)\n        ) {\n            Text(\n                stringResource(R.string.selected_game),', 1)

          tile_start = '''@Composable
private fun GameTile(
    game: GameInfo,'''
          tile_end = '''


private fun openGame(context: Context, packageName: String): Boolean ='''
          tile_new = '''@Composable
private fun GameTile(
    game: GameInfo,
    selected: Boolean,
    favorite: Boolean,
    onSelect: () -> Unit,
    onToggleFavorite: () -> Unit,
    onOpen: () -> Unit
) {
    val context = LocalContext.current
    val iconBitmap = remember(game.packageName) {
        runCatching {
            context.packageManager
                .getApplicationIcon(game.packageName)
                .toBitmap(width = 72, height = 72)
                .asImageBitmap()
        }.getOrNull()
    }

    Card(modifier = Modifier.fillMaxWidth()) {
        Column(
            modifier = Modifier.padding(8.dp),
            verticalArrangement = Arrangement.spacedBy(6.dp)
        ) {
            Surface(
                modifier = Modifier.fillMaxWidth(),
                shape = MaterialTheme.shapes.medium,
                color = if (selected) {
                    MaterialTheme.colorScheme.primaryContainer
                } else {
                    MaterialTheme.colorScheme.surfaceVariant
                },
                onClick = onSelect
            ) {
                Row(
                    modifier = Modifier.padding(8.dp),
                    horizontalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    iconBitmap?.let { icon ->
                        Image(
                            bitmap = icon,
                            contentDescription = stringResource(
                                R.string.game_icon_content_description,
                                game.label
                            ),
                            modifier = Modifier.size(40.dp)
                        )
                    }
                    Column(modifier = Modifier.weight(1f)) {
                        Text(
                            game.label,
                            style = MaterialTheme.typography.titleSmall,
                            maxLines = 1
                        )
                        Text(
                            if (selected) "SELECCIONADO" else game.packageName,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                            style = MaterialTheme.typography.labelSmall,
                            maxLines = 1
                        )
                    }
                }
            }

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(6.dp)
            ) {
                TextButton(onClick = onToggleFavorite, modifier = Modifier.weight(1f)) {
                    Text(if (favorite) "★ Fijado" else "☆ Fijar")
                }
                TextButton(onClick = onOpen, modifier = Modifier.weight(1f)) {
                    Text("Abrir")
                }
            }
        }
    }
}'''
          text = replace_between(text, tile_start, tile_end, tile_new + tile_end, 'compact library game tile')
          main_path.write_text(text, encoding='utf-8')

          tokens = Path('app/src/main/java/com/cardenaspiero255/gamehubultra/ui/theme/GameHubUiTokens.kt')
          token_text = tokens.read_text(encoding='utf-8')
          token_text = token_text.replace('val compactHorizontalPadding = 12.dp', 'val compactHorizontalPadding = 10.dp')
          token_text = token_text.replace('val compactSectionSpacing = 10.dp', 'val compactSectionSpacing = 8.dp')
          token_text = token_text.replace('val compactCardPadding = 14.dp', 'val compactCardPadding = 10.dp')
          token_text = token_text.replace('val titleLarge = 18.sp', 'val titleLarge = 17.sp')
          token_text = token_text.replace('val bodyLarge = 14.sp', 'val bodyLarge = 13.sp')
          tokens.write_text(token_text, encoding='utf-8')

          Path('.github/workflows/car-32-ui-reconstruction-patch.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-library-horizontal-layout.yml').write_text('''name: Fix library horizontal layout

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt'
      - '.github/workflows/fix-library-horizontal-layout.yml'

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make library grid adaptive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt')
          text = path.read_text()
          old = 'columns = GridCells.Fixed(4),'
          new = 'columns = GridCells.Adaptive(minSize = 180.dp),'
          if old not in text:
              print('Adaptive layout may already be applied; no source replacement needed.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit layout patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'Use adaptive columns for horizontal library layout'
          git push
''', encoding='utf-8')
          PY

      - name: Commit CAR-32 patch and restore workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt \
                  app/src/main/java/com/cardenaspiero255/gamehubultra/ui/theme/GameHubUiTokens.kt \
                  .github/workflows/fix-library-horizontal-layout.yml \
                  .github/workflows/car-32-ui-reconstruction-patch.yml
          if git diff --cached --quiet; then
            echo 'No CAR-32 changes required'
          else
            git commit -m 'feat(CAR-32): reconstruct original GameHub UI spacing'
            git push origin HEAD:codex/car-32-original-ui-reconstruction
          fi
