name: SonarQube Cloud Analysis

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_PROJECT_KEY_OVERRIDE: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION_OVERRIDE: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL_OVERRIDE: ${{ vars.SONAR_HOST_URL }}
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover SonarQube Cloud project
        id: discover
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: python3 .github/scripts/discover_sonar_project.py

      - name: Set up JDK 17
        if: steps.discover.outputs.found == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.discover.outputs.found == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.discover.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"

      - name: Compile app for Kotlin analysis
        if: steps.discover.outputs.found == 'true'
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Run SonarQube Cloud analysis
        if: steps.discover.outputs.found == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            ${{ steps.discover.outputs.region_arg }}
            -Dsonar.projectKey=${{ steps.discover.outputs.project_key }}
            -Dsonar.organization=${{ steps.discover.outputs.organization }}
            -Dsonar.sources=app/src/main
            -Dsonar.tests=app/src/test
            -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug
            -Dsonar.exclusions=**/build/**,**/*.b64
