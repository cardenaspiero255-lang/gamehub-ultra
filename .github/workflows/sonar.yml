name: SonarQube Cloud Analysis
# Optional only when discovery completes and confirms no configured Sonar project.

on:
  workflow_run:
    workflows: ["Unit Test Coverage"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # This job has SONAR_TOKEN. Never process PR coverage or foreign-repository artifacts.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_PROJECT_KEY_OVERRIDE: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION_OVERRIDE: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL_OVERRIDE: ${{ vars.SONAR_HOST_URL }}
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
      VERIFIED_COVERAGE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify coverage provenance matches the exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_COVERAGE_SHA" || {
            echo "::error::Coverage source SHA does not match the checkout."
            exit 1
          }

      - name: Verify Sonar token is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Repository secret SONAR_TOKEN is missing or unavailable."
            exit 1
          fi

      - name: Discover SonarQube Cloud project
        id: discover
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["SONAR_TOKEN"]
          repo_name = os.environ["REPO_NAME"]
          repo_owner = os.environ["REPO_OWNER"]
          project_override = os.environ.get("SONAR_PROJECT_KEY_OVERRIDE", "").strip()
          org_override = os.environ.get("SONAR_ORGANIZATION_OVERRIDE", "").strip()
          host_override = os.environ.get("SONAR_HOST_URL_OVERRIDE", "").strip().rstrip("/")

          allowed_hosts = [
              "https://sonarcloud.io",
              "https://sonarqube.us",
          ]
          if host_override and host_override not in allowed_hosts:
              raise SystemExit(
                  "SONAR_HOST_URL must be https://sonarcloud.io or https://sonarqube.us."
              )
          hosts = [host_override] if host_override else allowed_hosts

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "gamehub-ultra-sonar-discovery",
                  },
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def get_all_pages(base_url, item_key, max_pages=100):
              items = []
              for page in range(1, max_pages + 1):
                  separator = "&" if "?" in base_url else "?"
                  data = get_json(f"{base_url}{separator}p={page}")
                  batch = data.get(item_key, [])
                  if not isinstance(batch, list):
                      raise RuntimeError(
                          f"Unexpected Sonar response: {item_key!r} is not a list."
                      )
                  items.extend(batch)

                  paging = data.get("paging") or {}
                  total = int(paging.get("total") or 0)
                  page_size = int(paging.get("pageSize") or 50)
                  if not batch:
                      break
                  if total and page * page_size >= total:
                      break
                  if not total and len(batch) < page_size:
                      break
              else:
                  raise RuntimeError(
                      f"Sonar pagination exceeded {max_pages} pages for {item_key}."
                  )
              return items

          selected_host = None
          for host in hosts:
              try:
                  data = get_json(f"{host}/api/authentication/validate")
                  if data.get("valid") is True:
                      selected_host = host
                      break
              except Exception:
                  continue

          if not selected_host:
              raise SystemExit("SONAR_TOKEN was not accepted by sonarcloud.io or sonarqube.us.")

          project_key = project_override
          organization = org_override
          found = bool(project_key and organization)

          if not found:
              organizations = []
              discovery_failed = False
              if org_override:
                  organizations.append(org_override)
              else:
                  try:
                      org_items = get_all_pages(
                          f"{selected_host}/api/organizations/search?member=true&ps=50",
                          "organizations",
                      )
                      organizations.extend(
                          item.get("key", "")
                          for item in org_items
                          if item.get("key")
                      )
                  except Exception as exc:
                      discovery_failed = True
                      print(
                          "::notice::Sonar organization discovery failed "
                          f"({type(exc).__name__})."
                      )

              # Only search organizations confirmed by the authenticated Sonar
              # membership endpoint. Guessing the GitHub owner as a Sonar org
              # turns a legitimate empty membership into a false API error.
              search_term = project_override or repo_name
              query = urllib.parse.quote(search_term)
              matches = []

              for candidate_org in organizations:
                  organization_param = urllib.parse.quote(candidate_org)
                  try:
                      component_items = get_all_pages(
                          f"{selected_host}/api/components/search"
                          f"?qualifiers=TRK&q={query}&ps=50"
                          f"&organization={organization_param}",
                          "components",
                      )
                  except Exception as exc:
                      discovery_failed = True
                      print(
                          "::notice::Sonar project search failed for organization "
                          f"{candidate_org!r} ({type(exc).__name__})."
                      )
                      continue

                  components = component_items
                  if project_override:
                      exact = [
                          component
                          for component in components
                          if component.get("key", "") == project_override
                      ]
                  else:
                      exact = [
                          component
                          for component in components
                          if component.get("name", "").lower() == repo_name.lower()
                          or component.get("key", "").lower().endswith("_" + repo_name.lower())
                          or component.get("key", "").lower().endswith(":" + repo_name.lower())
                      ]

                  for component in exact:
                      component_key = component.get("key", "")
                      component_org = (
                          component.get("organization", "")
                          or candidate_org
                      )
                      if component_key and component_org:
                          matches.append((component_org, component_key))

              # Deduplicate identical discoveries while preserving order.
              matches = list(dict.fromkeys(matches))

              if discovery_failed:
                  raise SystemExit(
                      "Sonar project discovery did not complete; refusing to "
                      "treat an incomplete search as an absent project."
                  )

              if len(matches) == 1:
                  organization, discovered_key = matches[0]
                  if not project_key:
                      project_key = discovered_key
                  found = bool(project_key and organization)
              elif len(matches) > 1:
                  candidates = ", ".join(
                      f"{org}/{key}" for org, key in matches
                  )
                  raise SystemExit(
                      "Multiple Sonar projects match this repository name. "
                      "Refusing to guess the target project. Set repository variables "
                      "SONAR_PROJECT_KEY and SONAR_ORGANIZATION explicitly. "
                      f"Candidates: {candidates}"
                  )

          if not found:
              if project_override or org_override:
                  raise SystemExit(
                      "Sonar repository variables are configured, but the matching "
                      "project could not be resolved. Verify SONAR_PROJECT_KEY and "
                      "SONAR_ORGANIZATION."
                  )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"host={selected_host}\n")
                  out.write("region_arg=\n")
                  out.write("found=false\n")
                  out.write("project_key=\n")
                  out.write("organization=\n")
              print(
                  "::notice::SONAR_TOKEN is valid, but this repository has no "
                  "configured SonarQube Cloud project. Analysis is skipped until "
                  "SONAR_PROJECT_KEY and SONAR_ORGANIZATION are configured."
              )
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"host={selected_host}\n")
              out.write(
                  "region_arg=-Dsonar.region=us\n"
                  if selected_host == "https://sonarqube.us"
                  else "region_arg=\n"
              )
              out.write(f"found={'true' if found else 'false'}\n")
              out.write(f"project_key={project_key}\n")
              out.write(f"organization={organization}\n")

          print(
              f"Sonar project discovered for {repo_owner}/{repo_name}: "
              f"{organization}/{project_key}"
          )
          PY

      - name: Set up JDK 17
        if: steps.discover.outputs.found == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.discover.outputs.found == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.discover.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"

      - name: Compile app for Kotlin analysis
        if: steps.discover.outputs.found == 'true'
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Download JaCoCo report from the exact successful coverage run
        if: steps.discover.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamehub-ultra-coverage-report
          path: app/build/reports/coverage/test/debug
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate JaCoCo report before scanner import
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p "test_verify_sonar_jacoco.py" -v
          python3 .github/scripts/verify_sonar_jacoco.py \
            --report app/build/reports/coverage/test/debug/report.xml

      - name: Run SonarQube Cloud analysis
        if: steps.discover.outputs.found == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            ${{ steps.discover.outputs.region_arg }}
            -Dsonar.projectKey=${{ steps.discover.outputs.project_key }}
            -Dsonar.organization=${{ steps.discover.outputs.organization }}
            -Dsonar.sources=app/src/main
            -Dsonar.tests=app/src/test
            -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/build/**,**/*.b64
