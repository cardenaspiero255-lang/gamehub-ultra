name: Ultra Sentinel Reproduction Manifest
# Reproducibility metadata, not a paused process snapshot.
on:
  workflow_run:
    workflows: ['Android build', 'Unit Test Coverage']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  reproducibility:
    name: Record failed run evidence without code execution
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only trusted default-branch module
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false
      - name: Prepare sanitized reproducibility manifest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const {manifest}=require(path.resolve('.github/scripts/ultra_sentinel_replay.cjs'));
            const run=context.payload.workflow_run;
            const repo=context.repo.owner+'/'+context.repo.repo;
            if(run.head_repository?.full_name!==repo){
              core.warning('Skipping run from another repository');return;
            }
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:run.id,per_page:100
            });
            const data=manifest({
              repo,runId:run.id,sha:run.head_sha,workflow:run.name,
              conclusion:run.conclusion,url:run.html_url,
              jobs:jobs.slice(0,30).map(j=>({
                name:j.name,conclusion:j.conclusion,
                failedSteps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name).slice(0,8)
              }))
            });
            const folder=path.join(process.env.RUNNER_TEMP,'sentinel-repro');
            fs.mkdirSync(folder,{recursive:true});
            fs.writeFileSync(path.join(folder,'manifest.json'),JSON.stringify(data,null,2));
            await core.summary.addHeading('Ultra Sentinel: reproduction recipe')
              .addRaw('Failed workflow '+data.workflow+' at SHA '+data.sha+
                '. Metadata only; download manifest for safe rerun instructions.')
              .write();
      - name: Upload metadata manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-reproduction-manifest
          path: ${{ runner.temp }}/sentinel-repro/manifest.json
          if-no-files-found: warn
          retention-days: 14
