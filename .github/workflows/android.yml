name: Android build
# CAR-18 merge-sync validation
# CAR-18 validation trigger
# CAR-18 force-run 2

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "codex/car-18-final"
  pull_request:
    branches: ["main"]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Use current Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_DIR="$(find "$SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n1)"
          test -n "$CMDLINE_DIR"
          echo "$SDK_ROOT/cmdline-tools/$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/$CMDLINE_DIR/bin/sdkmanager" --version

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Validate release APK install-update-uninstall on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m1 "1"
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            test -s "$APK"
            adb install "$APK"
            adb shell pm path com.cardenaspiero255.gamehubultra | grep -q "base.apk"
            adb shell monkey -p com.cardenaspiero255.gamehubultra 1 >/dev/null
            adb install -r "$APK"
            adb shell pm path com.cardenaspiero255.gamehubultra | grep -q "base.apk"
            adb shell dumpsys package com.cardenaspiero255.gamehubultra | grep -q "versionCode"
            adb uninstall com.cardenaspiero255.gamehubultra
            if adb shell pm path com.cardenaspiero255.gamehubultra 2>/dev/null | grep -q "base.apk"; then
              echo "Package remained installed after uninstall."
              exit 1
            fi

      - name: Run baseline profile instrumentation on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m1 "1"
            gradle :baseline-profile:connectedNonMinifiedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace

      - name: Run macrobenchmarks on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            # android-emulator-runner owns ADB lifecycle and waits for boot.
            # Starting/reconnecting ADB here races with its emulator process.
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m1 "1"
            gradle :baseline-profile:connectedNonMinifiedReleaseAndroidTest               -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark               -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR               --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-ultra-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamehub-ultra-benchmark-reports
          path: |
            baseline-profile/build/outputs/**
            app/build/reports/**

      - name: Upload installable release outputs
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-ultra-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
