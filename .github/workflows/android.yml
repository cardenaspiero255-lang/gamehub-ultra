name: Android build
# CAR-18 merge-sync validation
# CAR-18 validation trigger
# CAR-18 force-run 2

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "codex/car-18-final"
  pull_request:
    branches: ["main"]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    env:
      EPIC_AUTH_BACKEND_URL: ${{ vars.EPIC_AUTH_BACKEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SENTRY_DSN: ""
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify benchmark fast-path contract
        shell: bash
        run: bash .github/scripts/test-benchmark-fast-path.sh

      - name: Verify CI safety contract regression coverage
        shell: bash
        run: python3 .github/scripts/test-ci-safety-contract-regressions.py

      - name: Verify CI safety contract
        shell: bash
        run: bash .github/scripts/test-ci-safety-contract.sh

      - name: Test Sentry release auth fallback
        shell: bash
        run: python3 .github/scripts/test-sentry-release-auth-fallback.py

      - name: Test CI performance metrics
        shell: bash
        run: python3 .github/scripts/test-ci-performance-metrics.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Install build SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          missing=()

          [ -s "$SDK_ROOT/platforms/android-36/android.jar" ] || missing+=("platforms;android-36")
          [ -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ] || missing+=("build-tools;36.0.0")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Build SDK packages already present; skipping sdkmanager."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing build SDK packages, attempt ${attempt}/3"
            if sdkmanager "${missing[@]}"; then
              exit 0
            fi
            rm -rf "$SDK_ROOT/.temp"
            sleep $((attempt * 10))
          done
          echo "Build SDK package installation failed after retries."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-disabled: false
          # device-validation owns cache writes for this commit; quality only
          # reads shared history so parallel jobs cannot race while saving it.
          cache-read-only: true

      - name: Run fast quality gates
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_CACHE_LOG="$RUNNER_TEMP/configuration-cache-reuse.log"
          QUALITY_LOG="$RUNNER_TEMP/quality-gates.log"
          QUALITY_ATTEMPT_LOG="$RUNNER_TEMP/quality-gates-attempt.log"
          QUALITY_MAX_ATTEMPTS=3
          QUALITY_RETRY_BASE_SECONDS=5
          QUALITY_TRANSIENT_RE='Received status code (408|425|429|500|502|503|504)|Read timed out|Connect timed out|Connection reset|Temporary failure in name resolution|Remote host terminated the handshake'

          # Android tooling creates this lazily during the first build. Create it
          # up front so that filesystem observation does not invalidate the
          # Configuration Cache before the identical second invocation.
          mkdir -p "$HOME/.config/.android/cache"

          run_quality_graph() {
            gradle \
              :app:assembleDebug \
              :app:lintDebug \
              --build-cache \
              --parallel \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --stacktrace 2>&1 | tee "$QUALITY_ATTEMPT_LOG"
          }

          : > "$QUALITY_LOG"
          quality_attempt=1
          while true; do
            : > "$QUALITY_ATTEMPT_LOG"
            if run_quality_graph; then
              cat "$QUALITY_ATTEMPT_LOG" >> "$QUALITY_LOG"
              break
            else
              quality_status=$?
            fi

            cat "$QUALITY_ATTEMPT_LOG" >> "$QUALITY_LOG"

            if (( quality_attempt >= QUALITY_MAX_ATTEMPTS )); then
              echo "Quality gate failed after $quality_attempt attempts." >&2
              exit "$quality_status"
            fi

            if ! grep -Eq "$QUALITY_TRANSIENT_RE" "$QUALITY_ATTEMPT_LOG"; then
              echo "Quality gate failed with a non-transient error; not retrying." >&2
              exit "$quality_status"
            fi

            sleep_seconds=$((QUALITY_RETRY_BASE_SECONDS * quality_attempt))
            echo "Transient dependency/network failure detected; retrying quality gate in ${sleep_seconds}s (attempt $((quality_attempt + 1))/$QUALITY_MAX_ATTEMPTS)." >&2
            sleep "$sleep_seconds"
            quality_attempt=$((quality_attempt + 1))
          done

          # Prime and then prove reuse of the dry-run Configuration Cache
          # entry without executing lint or assembly again.
          gradle \
            :app:assembleDebug \
            :app:lintDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --dry-run \
            --stacktrace >/dev/null
          gradle \
            :app:assembleDebug \
            :app:lintDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --dry-run \
            --stacktrace 2>&1 | tee "$CONFIG_CACHE_LOG"
          grep -Fq "Reusing configuration cache." "$CONFIG_CACHE_LOG"

      - name: Record Phase 3 artifact provenance
        shell: bash
        env:
          PHASE3_RUN_ID: ${{ github.run_id }}
          PHASE3_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="app/build/outputs/apk/debug"
          APK="$ARTIFACT_DIR/app-debug.apk"
          PROVENANCE="$ARTIFACT_DIR/phase3-artifact-provenance.env"
          test -f "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            printf 'run_id=%s\n' "$PHASE3_RUN_ID"
            printf 'sha=%s\n' "$PHASE3_SHA"
            printf 'apk_sha256=%s\n' "$APK_SHA256"
          } > "$PROVENANCE"

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/phase3-artifact-provenance.env
          if-no-files-found: error
          # APKs are already ZIP-compressed; recompressing them wastes CPU on the critical artifact path.
          compression-level: 0

      - name: Upload quality diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-quality-diagnostics
          path: |
            ${{ runner.temp }}/quality-gates.log
            ${{ runner.temp }}/configuration-cache-reuse.log
          if-no-files-found: ignore

  device-validation:
    runs-on: ubuntu-22.04
    env:
      EPIC_AUTH_BACKEND_URL: ${{ vars.EPIC_AUTH_BACKEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # CI intentionally builds with Sentry disabled so emulator installs,
      # baseline profiles and macrobenchmarks never pollute production telemetry.
      SENTRY_DSN: ""
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Use current Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_DIR="$(find "$SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n1)"
          test -n "$CMDLINE_DIR"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          ln -s "$SDK_ROOT/cmdline-tools/$CMDLINE_DIR" "$SDK_ROOT/cmdline-tools/latest"
          echo "$SDK_ROOT/cmdline-tools/$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/$CMDLINE_DIR/bin/sdkmanager" --version

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Test Android SDK retry safety
        shell: bash
        run: bash .github/scripts/test-android-sdk-retry-safety.sh

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          missing=()

          [ -s "$SDK_ROOT/platforms/android-35/android.jar" ] || missing+=("platforms;android-35")
          [ -s "$SDK_ROOT/platforms/android-36/android.jar" ] || missing+=("platforms;android-36")
          [ -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ] || missing+=("build-tools;36.0.0")
          [ -x "$SDK_ROOT/emulator/emulator" ] || missing+=("emulator")
          [ -x "$SDK_ROOT/platform-tools/adb" ] || missing+=("platform-tools")

          IMAGE_DIR="$SDK_ROOT/system-images/android-35/google_apis/x86_64"
          system_image_missing=0
          if [ ! -s "$IMAGE_DIR/system.img" ] || [ ! -s "$IMAGE_DIR/ramdisk.img" ] || [ ! -e "$IMAGE_DIR/data/empty_data_disk" ]; then
            missing+=("system-images;android-35;google_apis;x86_64")
            system_image_missing=1
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required Android SDK packages are already present; skipping sdkmanager."
            exit 0
          fi

          echo "Missing Android SDK packages:"
          printf ' - %s\n' "${missing[@]}"

          for attempt in 1 2 3; do
            echo "Installing missing Android SDK packages, attempt ${attempt}/3"
            if sdkmanager "${missing[@]}"; then
              exit 0
            fi
            echo "sdkmanager failed on attempt ${attempt}; removing partial package state before retry."
            rm -rf "$SDK_ROOT/.temp"
            if [ "$system_image_missing" -eq 1 ]; then
              rm -rf \
                "$SDK_ROOT/system-images/android-35/google_apis/x86_64" \
                "$SDK_ROOT/system-images/android-35/google_apis/.installer" \
                "$SDK_ROOT/system-images/android-35/.installer"
            fi
            sleep $((attempt * 15))
          done
          echo "Android SDK package installation failed after retries."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-disabled: false
          cache-read-only: false

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/gamehub-ultra-ci-release.jks"
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias gamehub-ci \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=GameHub Ultra CI,O=GameHub Ultra,C=CL" \
            -noprompt
          {
            echo "GAMEHUB_RELEASE_KEYSTORE_PATH=$KEYSTORE"
            echo "GAMEHUB_RELEASE_STORE_PASSWORD=$PASSWORD"
            echo "GAMEHUB_RELEASE_KEY_ALIAS=gamehub-ci"
            echo "GAMEHUB_RELEASE_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare deterministic API 35 AVD
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          IMAGE_DIR="$SDK_ROOT/system-images/android-35/google_apis/x86_64"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "Android Emulator binary is missing or not executable: $EMULATOR_BIN"
            exit 1
          fi
          test -d "$IMAGE_DIR"
          test -s "$IMAGE_DIR/system.img"
          test -s "$IMAGE_DIR/ramdisk.img"
          # API 35 r09+ seeds /data from data/empty_data_disk instead of
          # shipping the legacy userdata.img used by older system images.
          test -e "$IMAGE_DIR/data/empty_data_disk"

          AVD_HOME="$HOME/.android/avd"
          AVD_DIR="$AVD_HOME/gamehub-api35.avd"
          AVD_INI="$AVD_HOME/gamehub-api35.ini"
          # Keep the emulator on Android's documented default AVD location.
          # Overriding ANDROID_AVD_HOME changes how relative AVD paths are resolved
          # and made the manually-created metadata invisible to -list-avds.
          unset ANDROID_EMULATOR_HOME ANDROID_AVD_HOME
          rm -rf "$AVD_DIR" "$AVD_INI"
          mkdir -p "$AVD_DIR"

          # Build the AVD metadata directly from the installed API 35 image.
          # This avoids avdmanager's current device-profile parser failure while
          # preserving the real Android Emulator and all downstream validation.
          cat > "$AVD_INI" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/gamehub-api35.avd
          target=android-35
          EOF

          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=gamehub-api35
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=gamehub-api35
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=4G
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.device.manufacturer=GameHub
          hw.device.name=gamehub_ci_phone
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.gyroscope=yes
          hw.initialOrientation=portrait
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=4096
          hw.sdCard=no
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          runtime.network.latency=none
          runtime.network.speed=full
          showDeviceFrame=no
          skin.dynamic=yes
          skin.name=1080x1920
          tag.display=Google APIs
          tag.id=google_apis
          target=android-35
          vm.heapSize=512
          EOF

          mkdir -p "$HOME/.android"
          : > "$HOME/.emulator_console_auth_token"

          test -s "$AVD_INI"
          test -s "$AVD_DIR/config.ini"
          grep -Fxq "target=android-35" "$AVD_DIR/config.ini"
          grep -Fxq "abi.type=x86_64" "$AVD_DIR/config.ini"
          AVD_LIST="$RUNNER_TEMP/avd-list.txt"
          if ! "$EMULATOR_BIN" -list-avds | tee "$AVD_LIST" | grep -Fxq "gamehub-api35"; then
            echo "The emulator did not discover the API 35 AVD in the default Android home."
            echo "AVD metadata:"
            find "$HOME/.android" -maxdepth 3 -type f -print -exec sed -n '1,120p' {} \; || true
            exit 1
          fi

      - name: Build telemetry-disabled release APK and AAB for validation
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "Android Emulator binary is missing or not executable: $EMULATOR_BIN"
            exit 1
          fi
          adb start-server >/dev/null

          EMULATOR_LOG="$RUNNER_TEMP/gamehub-emulator.log"
          BUILD_LOG="$RUNNER_TEMP/release-validation.log"
          # Phase 2 A/B candidate: main is the build-first control. Start the
          # emulator immediately so this run actually exercises maximum overlap;
          # CI then measures whether the saved boot latency outweighs CPU contention.
          EXCLUSIVE_BUILD_SECONDS=0
          AB_METRICS="$RUNNER_TEMP/emulator-startup-ab.md"
          BUILD_START_EPOCH="$(date +%s)"

          # Android tooling creates this lazily during the first build. Create it
          # before configuring the release/performance graph so the identical
          # second invocation can reuse the Configuration Cache.
          mkdir -p "$HOME/.config/.android/cache"

          # Start the complete release + performance-variant DAG first. The A/B
          # candidate deliberately gives it no exclusive CPU window.
          (
            set -o pipefail
            gradle \
              :app:assembleRelease \
              :app:bundleRelease \
              :app:assembleNonMinifiedRelease \
              :baseline-profile:assembleNonMinifiedRelease \
              --build-cache \
              --parallel \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --stacktrace 2>&1 | tee "$BUILD_LOG"

            # Prime and then prove reuse of the dry-run Configuration Cache
            # entry without executing the expensive release/performance graph
            # again. The two probes are intentionally identical.
            gradle \
              :app:assembleRelease \
              :app:bundleRelease \
              :app:assembleNonMinifiedRelease \
              :baseline-profile:assembleNonMinifiedRelease \
              --build-cache \
              --parallel \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --dry-run \
              --stacktrace >/dev/null
            RELEASE_CONFIG_CACHE_LOG="$RUNNER_TEMP/release-configuration-cache-reuse.log"
            gradle \
              :app:assembleRelease \
              :app:bundleRelease \
              :app:assembleNonMinifiedRelease \
              :baseline-profile:assembleNonMinifiedRelease \
              --build-cache \
              --parallel \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --dry-run \
              --stacktrace 2>&1 | tee "$RELEASE_CONFIG_CACHE_LOG"
            grep -Fq "Reusing configuration cache." "$RELEASE_CONFIG_CACHE_LOG"
          ) &
          BUILD_PID=$!

          elapsed=0
          while kill -0 "$BUILD_PID" 2>/dev/null && [ "$elapsed" -lt "$EXCLUSIVE_BUILD_SECONDS" ]; do
            sleep 2
            elapsed=$((elapsed + 2))
          done

          EMULATOR_LAUNCH_EPOCH="$(date +%s)"
          echo "Launching API 35 emulator after ${elapsed}s of build-only CPU time."
          nohup "$EMULATOR_BIN" -avd gamehub-api35 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -no-metrics \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -netdelay none \
            -netspeed full \
            >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          {
            echo "EMULATOR_PID=$EMULATOR_PID"
            echo "EMULATOR_LOG=$EMULATOR_LOG"
            echo "EXCLUSIVE_BUILD_SECONDS=$EXCLUSIVE_BUILD_SECONDS"
          } >> "$GITHUB_ENV"

          sleep 2
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo "Android emulator exited immediately after launch."
            cat "$EMULATOR_LOG" || true
            exit 1
          fi

          if ! wait "$BUILD_PID"; then
            echo "Release/performance prebuild failed."
            exit 1
          fi
          BUILD_COMPLETE_EPOCH="$(date +%s)"
          {
            echo "# Emulator startup A/B"
            echo
            echo "- exclusive_build_seconds: ${EXCLUSIVE_BUILD_SECONDS}"
            echo "- build_start_epoch: ${BUILD_START_EPOCH}"
            echo "- emulator_launch_epoch: ${EMULATOR_LAUNCH_EPOCH}"
            echo "- build_complete_epoch: ${BUILD_COMPLETE_EPOCH}"
            echo "- launch_delay_seconds: $((EMULATOR_LAUNCH_EPOCH - BUILD_START_EPOCH))"
            echo "- build_duration_seconds: $((BUILD_COMPLETE_EPOCH - BUILD_START_EPOCH))"
          } > "$AB_METRICS"
          {
            echo "EMULATOR_LAUNCH_EPOCH=$EMULATOR_LAUNCH_EPOCH"
            echo "BUILD_COMPLETE_EPOCH=$BUILD_COMPLETE_EPOCH"
            echo "AB_METRICS=$AB_METRICS"
          } >> "$GITHUB_ENV"

      - name: Wait for API 35 emulator readiness
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR_LOG="${EMULATOR_LOG:-$RUNNER_TEMP/gamehub-emulator.log}"
          dump_emulator_log_on_failure() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ -f "$EMULATOR_LOG" ]; then
              echo "::group::Android emulator startup log"
              cat "$EMULATOR_LOG"
              echo "::endgroup::"
            fi
            exit "$rc"
          }
          trap dump_emulator_log_on_failure EXIT

          if [ -z "${EMULATOR_PID:-}" ] || ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo "Android emulator process is not alive before readiness validation."
            exit 1
          fi

          timeout 300 adb wait-for-device
          timeout 600 bash -c '
            while true; do
              state="$(adb get-state 2>/dev/null || true)"
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
                break
              fi
              sleep 2
            done
          '

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | grep -Fxq "35"
          adb devices

      - name: Validate release APK install-update-uninstall on API 35
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/apk-install-validation.log") 2>&1
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "No installable release APK found under app/build/outputs/apk/release"
            find app/build/outputs -maxdepth 5 -type f -print | sort || true
            exit 1
          fi
          echo "Validating release APK: $APK"
          adb install "$APK"
          adb shell pm path com.cardenaspiero255.gamehubultra | grep -q "base.apk"
          adb shell monkey -p com.cardenaspiero255.gamehubultra 1 >/dev/null
          adb install -r "$APK"
          adb shell pm path com.cardenaspiero255.gamehubultra | grep -q "base.apk"
          adb shell dumpsys package com.cardenaspiero255.gamehubultra | grep -q "versionCode"
          adb uninstall com.cardenaspiero255.gamehubultra
          if adb shell pm path com.cardenaspiero255.gamehubultra 2>/dev/null | grep -q "base.apk"; then
            echo "Package remained installed after uninstall."
            exit 1
          fi

      - name: Verify MainActivity presentation wiring on API 35
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest \
            --build-cache \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --stacktrace

      - name: Run baseline profile and macrobenchmarks on API 35
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf \
            baseline-profile/build/outputs/androidTest-results \
            baseline-profile/build/reports/androidTests
          LOG="$RUNNER_TEMP/performance-validation.log"
          gradle :baseline-profile:connectedNonMinifiedReleaseAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile,Macrobenchmark \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.skipBenchmarksOnEmulator=false \
            --build-cache \
            --no-configuration-cache \
            --stacktrace 2>&1 | tee "$LOG"
          if grep -Fq "[EmulatorConsole]: Failed to start Emulator console" "$LOG"; then
            echo "ddmlib could not connect to the emulator console."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("baseline-profile/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          baseline_cases = []
          macro_cases = []
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  classname = case.attrib.get("classname", "")
                  if classname.endswith("BaselineProfileGenerator"):
                      baseline_cases.append(case)
                  if classname.endswith("GameHubMacrobenchmark"):
                      macro_cases.append(case)

          if len(baseline_cases) < 1:
              raise SystemExit(
                  f"Expected at least 1 BaselineProfileGenerator case, found {len(baseline_cases)}"
              )
          if len(macro_cases) < 3:
              raise SystemExit(
                  f"Expected at least 3 GameHubMacrobenchmark cases, found {len(macro_cases)}"
              )

          required_cases = baseline_cases + macro_cases
          skipped = [
              f"{case.attrib.get('classname', '<unknown>')}#{case.attrib.get('name', '<unknown>')}"
              for case in required_cases
              if case.find("skipped") is not None
          ]
          if skipped:
              raise SystemExit(f"Required performance tests were skipped: {skipped}")

          print(
              "Executed baseline profiles:",
              [case.attrib.get("name") for case in baseline_cases],
          )
          print(
              "Executed macrobenchmarks:",
              [case.attrib.get("name") for case in macro_cases],
          )
          PY

      - name: Stop API 35 emulator without noisy console shutdown
        if: always()
        shell: bash
        run: |
          set +e
          # The Android Emulator currently emits "ERROR | stop: Not implemented"
          # during adb emu kill on hosted runners. This CI uses no snapshots, so
          # terminate the isolated emulator process directly instead of invoking
          # the console shutdown path.
          if [ -n "${EMULATOR_PID:-}" ] && kill -0 "$EMULATOR_PID" 2>/dev/null; then
            kill -KILL "$EMULATOR_PID" 2>/dev/null || true
            wait "$EMULATOR_PID" 2>/dev/null || true
          fi
          adb kill-server >/dev/null 2>&1 || true

      - name: Reject known CAR-29 emulator noise
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for log in \
            "$RUNNER_TEMP/avd-create.log" \
            "$RUNNER_TEMP/performance-validation.log" \
            "${EMULATOR_LOG:-$RUNNER_TEMP/gamehub-emulator.log}"; do
            [ -f "$log" ] || continue
            if grep -En \
              'Could not load devices|adb.*failed with exit code 1|Failed to start Emulator console|stop: Not implemented' \
              "$log"; then
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Known CAR-29 emulator errors are still present."
            exit 1
          fi

      - name: Discover Sentry project for trusted release
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: python3 .github/scripts/register_sentry_release.py --discover-only

      - name: Build distributable release APK and AAB with Sentry
        if: success() && github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: gamehub-ultra@${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning::SENTRY_DSN is unavailable; distributable CI release will keep telemetry disabled."
          else
            echo "Rebuilding distributable release outputs with Sentry enabled."
          fi
          # Pull-request builds never receive Sentry secrets. On trusted main/manual
          # runs this rebuild overwrites the validation outputs with telemetry-enabled
          # artifacts carrying the exact git-backed Sentry release identifier.
          gradle :app:assembleRelease :app:bundleRelease             --build-cache             --rerun-tasks             --stacktrace 2>&1 | tee "$RUNNER_TEMP/distributable-release.log"

      - name: Register Sentry release and GitHub commit
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: gamehub-ultra@${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: python3 .github/scripts/register_sentry_release.py

      - name: Record failure-analysis handoff
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Android CI failed. Gemini analysis is intentionally not credentialed in pull_request workflows." 
          echo "Use a trusted default-branch workflow_run consumer for any secret-backed analysis."

      - name: Upload Gemini failure analysis
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-gemini-failure-analysis
          path: ${{ runner.temp }}/gemini-analysis/**
          if-no-files-found: ignore

      - name: Upload emulator startup A/B metrics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-emulator-startup-ab
          path: ${{ runner.temp }}/emulator-startup-ab.md
          if-no-files-found: error

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-emulator-diagnostics
          path: |
            ${{ runner.temp }}/gamehub-emulator.log
            ${{ runner.temp }}/avd-list.txt
          if-no-files-found: ignore

      - name: Upload benchmark reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: gamehub-ultra-benchmark-reports
          path: |
            baseline-profile/build/outputs/**
            app/build/reports/**

      - name: Upload installable release outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gamehub-ultra-release
          path: |
            app/build/outputs/apk/release/**/*.apk
            app/build/outputs/bundle/release/**/*.aab
          if-no-files-found: error


  build:
    name: build
    if: always()
    needs:
      - quality
      - device-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify all Android CI gates
        shell: bash
        run: |
          set -euo pipefail
          echo "quality=${{ needs.quality.result }}"
          echo "device-validation=${{ needs.device-validation.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.device-validation.result }}" = "success"

      - name: Download exact-run quality artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamehub-ultra-debug
          path: ${{ runner.temp }}/phase3-debug-reuse
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          # Cut 3 keeps this gate verification-only: consume the exact artifact
          # produced by quality and never invoke Gradle or rebuild it here.
          merge-multiple: false

      - name: Verify Phase 3 artifact provenance
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/phase3-debug-reuse"
          APK="$ARTIFACT_DIR/app-debug.apk"
          PROVENANCE="$ARTIFACT_DIR/phase3-artifact-provenance.env"
          test -f "$APK"
          test -f "$PROVENANCE"
          grep -Fxq "run_id=$EXPECTED_RUN_ID" "$PROVENANCE"
          grep -Fxq "sha=$EXPECTED_SHA" "$PROVENANCE"
          RECORDED_SHA256="$(sed -n 's/^apk_sha256=//p' "$PROVENANCE")"
          test -n "$RECORDED_SHA256"
          test "$(printf '%s' "$RECORDED_SHA256" | wc -l)" -eq 0
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$RECORDED_SHA256"
