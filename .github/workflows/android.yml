name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "emulator"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      # Catch baseline-profile/Kotlin/Java/test packaging problems before paying
      # the API 35 emulator boot cost.
      - name: Preflight baseline profile tests
        run: gradle :baseline-profile:assembleDebug --stacktrace

      - name: Launch API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          wipe-data: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            gradle :baseline-profile:connectedCheck --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-ultra-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamehub-ultra-benchmark-reports
          path: |
            baseline-profile/build/outputs/**
            app/build/reports/**

      - name: Upload release validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-ultra-release-validation-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

