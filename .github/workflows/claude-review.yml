name: Claude PR Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: claude-review-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == '/claude review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
      TRIGGER_ACTOR: ${{ github.actor }}

    steps:
      - name: Check out trusted reviewer
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false

      - name: Verify Anthropic key is configured
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is missing or unavailable."
            exit 1
          fi

      - name: Review pull request with Claude Sonnet 5
        run: python3 .github/scripts/claude_pr_review.py
