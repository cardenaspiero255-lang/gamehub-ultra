name: Ultra Sentinel Kotlin Mutation Lab
# Fast static planner on PRs; expensive Android fault injection only by opt-in label/manual run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/scripts/ultra_sentinel_kotlin_mutation.py'
      - '.github/scripts/ultra_sentinel_kotlin_mutation_test.py'
      - '.github/workflows/ultra-sentinel-kotlin-mutation.yml'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/domain/ThermalPredictionEngine.kt'
      - 'app/src/test/java/com/cardenaspiero255/gamehubultra/domain/ThermalPredictionEngineTest.kt'
  workflow_dispatch:
    inputs:
      max_mutants:
        description: Number of Kotlin thermal mutants to execute (1-5)
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '3', '4', '5']

permissions:
  contents: read

concurrency:
  group: sentinel-kotlin-mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Kotlin mutation syntax + read-only plan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout PR without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Python contract and source anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/ultra_sentinel_kotlin_mutation.py
          python3 -m unittest discover -s .github/scripts -p 'ultra_sentinel_kotlin_mutation_test.py' -v
          python3 .github/scripts/ultra_sentinel_kotlin_mutation.py --mode plan

  mutate:
    name: Android thermal unit mutation / explicitly approved
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'sentinel-kotlin-mutation'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout isolated tested SHA without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up project Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute one baseline and bounded Kotlin mutants
        shell: bash
        env:
          SENTINEL_KOTLIN_MUTATION_APPROVED: '1'
          SENTINEL_MUTANT_LIMIT: ${{ inputs.max_mutants || '2' }}
        run: |
          set -euo pipefail
          case "$SENTINEL_MUTANT_LIMIT" in 1|2|3|4|5) ;; *) exit 2 ;; esac
          python3 .github/scripts/ultra_sentinel_kotlin_mutation.py \
            --mode run \
            --max-mutants "$SENTINEL_MUTANT_LIMIT" \
            --output "$RUNNER_TEMP/ultra-sentinel-kotlin-mutation.json"
      - name: Upload outcome (no source or log secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-kotlin-thermal-mutation
          path: ${{ runner.temp }}/ultra-sentinel-kotlin-mutation.json
          if-no-files-found: warn
          retention-days: 14
