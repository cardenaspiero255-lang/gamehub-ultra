name: Apply adaptive library layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make library grid adaptive
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          old = 'columns = GridCells.Fixed(4),'
          new = 'columns = GridCells.Adaptive(minSize = 168.dp),'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected library grid declaration was not found')

      - name: Commit layout patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/cardenaspiero255/gamehubultra/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No layout changes required'
          else
            git commit -m 'Improve horizontal space in library grid'
            git push
          fi
