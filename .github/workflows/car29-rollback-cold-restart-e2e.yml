name: CAR-29 trusted Android cold-restart rollback E2E
# Executes exclusively on trusted main; never receives credentials from untrusted PRs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/car29-rollback-cold-restart-e2e.yml'
permissions:
  contents: read
concurrency:
  group: car29-trusted-rollback-cold-restart
  cancel-in-progress: false
jobs:
  cold-restart-proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout immutable trusted main without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.13'
      - name: Validate workflow and driver safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_car29_cold_restart_workflow.py tools/test_verify_car29_restart_receipt.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_car29_android_restart.py' -v
      - name: Boot isolated API35 emulator for authentic rollback proof
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -e /dev/kvm ]; then
            echo "::error::Isolated Android emulator needs /dev/kvm on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          bash .github/scripts/install-android-runtime-sdk.sh
          IMAGE_DIR="$SDK_ROOT/system-images/android-35/google_apis/x86_64"
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR_BIN"
          test -s "$IMAGE_DIR/system.img"
          test -s "$IMAGE_DIR/ramdisk.img"
          test -e "$IMAGE_DIR/data/empty_data_disk"
          AVD_HOME="$HOME/.android/avd"
          AVD_DIR="$AVD_HOME/car29-rollback-e2e.avd"
          AVD_INI="$AVD_HOME/car29-rollback-e2e.ini"
          unset ANDROID_EMULATOR_HOME ANDROID_AVD_HOME
          rm -rf "$AVD_DIR" "$AVD_INI"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_INI" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/car29-rollback-e2e.avd
          target=android-35
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=car29-rollback-e2e
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=car29-rollback-e2e
          disk.dataPartition.size=4G
          hw.audioInput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.ramSize=4096
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          target=android-35
          vm.heapSize=512
          EOF
          mkdir -p "$HOME/.android"
          : > "$HOME/.emulator_console_auth_token"
          "$EMULATOR_BIN" -list-avds | grep -Fxq car29-rollback-e2e
          adb start-server >/dev/null
          nohup "$EMULATOR_BIN" -avd car29-rollback-e2e \
            -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save \
            -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 4 \
            -camera-back none -camera-front none -netdelay none -netspeed full \
            > "$RUNNER_TEMP/car29-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          sleep 2
          kill -0 "$EMULATOR_PID"
          timeout 300 adb wait-for-device
          timeout 600 bash -c '
            while true; do
              state="$(adb get-state 2>/dev/null || true)"
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$state" = "device" ] && [ "$boot" = "1" ]; then break; fi
              sleep 2
            done
          '
          kill -0 "$EMULATOR_PID"
          adb shell getprop ro.kernel.qemu | tr -d '\r' | grep -Fxq 1
          adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fxq 35
          test "$(adb devices | sed -n '/device$/p' | wc -l | tr -d ' ')" -eq 1
      - name: Execute actual OS force-stop + cold start and persistent rollback
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/car29-verify-android-e2e.sh
      - name: Verify the exact non-skipped SHA-bound Android receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s build/car29-android-e2e/CAR29-E2E-receipt.json
          python3 tools/verify_car29_restart_receipt.py build/car29-android-e2e/CAR29-E2E-receipt.json "$(git rev-parse HEAD)"
      - name: Upload only minimal JSON proof of real emulator restart
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: car29-cold-restart-proof
          path: build/car29-android-e2e/CAR29-E2E-receipt.json
          if-no-files-found: error
          retention-days: 7
