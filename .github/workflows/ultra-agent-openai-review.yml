name: Ultra Agent OpenAI Review

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "app/src/main/java/com/cardenaspiero255/gamehubultra/ai/UltraUnifiedAgent.kt"
      - "app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceCommandParser.kt"
      - "app/src/test/java/com/cardenaspiero255/gamehubultra/ai/UltraUnifiedAgentTest.kt"
      - "app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceCommandParserTest.kt"
      - ".github/workflows/ultra-agent-openai-review.yml"

permissions:
  contents: read

concurrency:
  group: ultra-agent-openai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-ultra-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect Ultra Unified Agent context
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ultra-agent-openai-context.txt"
          : > "$OUT"
          for file in \
            app/src/main/java/com/cardenaspiero255/gamehubultra/ai/UltraUnifiedAgent.kt \
            app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceCommandParser.kt \
            app/src/test/java/com/cardenaspiero255/gamehubultra/ai/UltraUnifiedAgentTest.kt \
            app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceCommandParserTest.kt; do
            if [ -f "$file" ]; then
              {
                echo "===== FILE: $file ====="
                sed -n '1,300p' "$file"
                echo
              } >> "$OUT"
            fi
          done
          echo "ULTRA_AGENT_OPENAI_CONTEXT=$OUT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Generate read-only OpenAI Ultra agent review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT="ultra-agent-openai-review.md"
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            cat > "$REPORT" <<'EOF'
          # Ultra Unified Agent OpenAI review

          OpenAI review was not executed because `OPENAI_API_KEY` is not available to this workflow run.

          This workflow is read-only and never modifies code.
          EOF
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          from openai import OpenAI
          import os

          context = Path(os.environ["ULTRA_AGENT_OPENAI_CONTEXT"]).read_text(encoding="utf-8", errors="replace")
          prompt = """
          Eres un revisor senior Android/Kotlin especializado en asistentes de voz y parsers de comandos.

          Genera un reporte Markdown read-only para GameHub Ultra PR #49.

          Reglas:
          - No propongas commits automaticos.
          - No pidas modificar secrets.
          - No incluyas ni inventes claves API.
          - Solo diagnostica y sugiere.
          - Enfocate en riesgos de arquitectura, tests faltantes y conflictos de parser/router.
          - Marca riesgos de juego fantasma, comandos peligrosos, palabras mode/profile/modo/perfil en titulos, chat general mal clasificado y llamadas/interrupciones Android.
          - Si sugieres parches, que sean pequenos, revisables y con archivo objetivo.
          - Termina con una lista priorizada: P0 bloqueante, P1 importante, P2 mejora.

          Contexto actual:
          ```text
          """ + context[:30000] + """
          ```
          """

          client = OpenAI()
          try:
              response = client.responses.create(
                  model="gpt-5-mini",
                  input=prompt,
                  reasoning={"effort": "medium"},
                  max_output_tokens=7000,
              )
              text = getattr(response, "output_text", "") or "OpenAI returned no readable output."
          except Exception as exc:
              text = f"OpenAI review failed: {exc}"

          Path("ultra-agent-openai-review.md").write_text(
              "# Ultra Unified Agent OpenAI review\n\n"
              "Read-only helper report. No code was modified by this workflow.\n\n"
              + text.strip()
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload OpenAI Ultra agent review
        uses: actions/upload-artifact@v6
        with:
          name: ultra-agent-openai-review
          path: ultra-agent-openai-review.md
          if-no-files-found: error
