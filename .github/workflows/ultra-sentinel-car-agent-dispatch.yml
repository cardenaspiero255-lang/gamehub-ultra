name: Ultra Sentinel - CAR Agent Dispatch
# Event-driven CAR handoff to an installed external coding agent. No cron.
on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
jobs:
  car-dispatch:
    name: Assign next reviewed CAR to coding agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'car:ready') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    steps:
      - name: Select queued CAR and hand off to authorized external agent
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CAR_AGENT_LOGIN: ${{ vars.CAR_AGENT_LOGIN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='cardenaspiero255-lang'||repo!=='gamehub-ultra')return;
            let issue=null;
            if(context.eventName==='issues'){
              if(context.actor!==owner)return;
              const i=context.payload.issue;
              if(!i||i.user?.login!==owner||!/^CAR[- ]\d+\b/i.test(i.title||''))return;
              issue=i;
            }else{
              const pr=context.payload.pull_request;
              // Only merged owner CAR PRs advance the pre-existing queue.
              if(!pr?.merged||pr.user?.login!==owner||!/^CAR[- ]\d+\b/i.test(pr.title||''))return;
              const list=await github.paginate(github.rest.issues.listForRepo,
                {owner,repo,state:'open',labels:'car:ready',per_page:100});
              const ready=list.filter(x=>!x.pull_request&&x.user?.login===owner&&
                /^CAR[- ]\d+\b/i.test(x.title||''));
              ready.sort((a,b)=>Number(a.title.match(/\d+/)[0])-Number(b.title.match(/\d+/)[0]));
              issue=ready[0];
            }
            if(!issue||(issue.labels||[]).every(l=>(l.name||l)!=='car:ready'))return;
            // Assigning to an agent needs a connected/authorized GitHub coding agent.
            const login=(process.env.CAR_AGENT_LOGIN||'copilot-swe-agent').trim();
            if(!/^[a-zA-Z0-9-]{1,39}$/.test(login)||login===owner)return;
            try{
              await github.rest.issues.addAssignees({owner,repo,issue_number:issue.number,
                assignees:[login]});
            }catch(e){
              core.notice('CAR '+issue.number+' requires GitHub agent installation/permission: '+(e.status||'unavailable'));
              return;
            }
            // A successful agent handoff is idempotent: remove the ready label.
            await github.rest.issues.addLabels({owner,repo,issue_number:issue.number,
              labels:['car:active']});
            await github.rest.issues.removeLabel({owner,repo,issue_number:issue.number,
              name:'car:ready'});
            await github.rest.issues.createComment({owner,repo,issue_number:issue.number,
              body:[
                '### GameHub Ultra · CAR implementado por agente externo',
                'Agente asignado: @'+login+'.',
                '',
                'Implementar el CAR descrito en este issue, sin duplicar funciones del repositorio.',
                '1. Examinar main, el roadmap, dependencias y PRs abiertos del mismo CAR.',
                '2. Aplicar TDD RED → GREEN → REFACTOR; cubrir familia y variantes del error.',
                '3. Abrir PR **draft** pequeño, trazable al número de CAR y con pruebas.',
                '4. Validar Android build, Unit Test Coverage y Ultra Sentinel en el SHA final.',
                '5. Revisar con Codex y revisión independiente cuando estén disponibles.',
                '6. No silenciar fallos, inventar optimizaciones o fusionar por cuenta del agente.',
                '7. Solicitar revisión humana de cualquier cambio de seguridad o CI.',
                '',
                'Los PR solamente se fusionan mediante la política protegida y autorizada.',
                'Si faltan permisos o capacidad, informar y no declarar el CAR terminado.'
              ].join('\n')});
            core.notice('CAR #'+issue.number+' handed off to '+login);
