name: Ultra Sentinel Reliability - 100 executions
# 100 deterministic executions across five unprivileged matrix shards.
# Each execution checks trusted, attacker, and tampered repository profiles.
# These are in-repository synthetic profiles, NOT 3 external repositories.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ultra_sentinel_yaml_ast.cjs'
      - '.github/scripts/ultra_sentinel_reliability.cjs'
      - '.github/scripts/ultra_sentinel_policy.cjs'
      - '.github/scripts/ultra_sentinel_reliability.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ultra-sentinel-reliability-100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenarios:
    name: Reliability shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout isolated PR without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install locked parser without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run 20 distinct synthetic executions and 3 profiles each
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sentinel-reliability"
          node .github/scripts/ultra_sentinel_reliability.cjs \
            --count 20 --offset "$(( SHARD * 20 ))" |
            tee "$RUNNER_TEMP/sentinel-reliability/shard-$SHARD.json"
      - name: Archive SHA-scoped reproducible reliability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sentinel-reliability-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/sentinel-reliability/
          retention-days: 14
          if-no-files-found: error
  gate:
    name: Sentinel Reliability / 100 scenarios
    runs-on: ubuntu-latest
    needs: [scenarios]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Fail if any unprivileged reliability shard failed
        env:
          MATRIX_RESULT: ${{ needs.scenarios.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = success
