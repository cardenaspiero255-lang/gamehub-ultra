name: Mergify Policy Regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.mergify.yml'
      - 'tests/automerge_policy.test.cjs'
      - '.github/workflows/mergify-policy-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mergify-policy-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned YAML parser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check auto-merge policy against privileged and mixed files
        run: node --test tests/automerge_policy.test.cjs
