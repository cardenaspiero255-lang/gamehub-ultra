name: CAR-43 Format Once

on:
  push:
    branches: ["car-43-ai-mistake-recovery"]
    paths:
      - "supabase/functions/ultra-research/research_test.ts"
      - ".github/workflows/car43-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: car-43-ai-mistake-recovery
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.1.x
      - name: Format CAR-43 research tests
        run: deno fmt supabase/functions/ultra-research/research_test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/ultra-research/research_test.ts
          git commit -m "style(car43): format OLED regression"
          git push origin HEAD:car-43-ai-mistake-recovery
