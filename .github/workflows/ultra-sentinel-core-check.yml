name: Ultra Sentinel Core Tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ultra_sentinel_core.cjs'
      - '.github/scripts/ultra_sentinel_core.test.cjs'
      - '.github/workflows/ultra-sentinel-auto-review.yml'
      - '.github/workflows/ultra-sentinel-core-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Sentinel Core / Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR for isolated tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check syntax
        run: node --check .github/scripts/ultra_sentinel_core.cjs && node --check .github/scripts/ultra_sentinel_core.test.cjs
      - name: Run independent reviewer regression suite
        run: node --test .github/scripts/ultra_sentinel_core.test.cjs
