name: Ultra Sentinel Core Tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ultra_sentinel_*.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/scripts/install_sentinel_hook.sh'
      - '.githooks/pre-commit'
      - '.github/workflows/ultra-sentinel-*.yml'
      - 'docs/ULTRA_SENTINEL_LOCAL.md'
      - '.github/sentinel-contracts/**'
      - '.github/sentinel-evidence-ledger.json'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceRecognitionRetryGate.kt'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceAssistantController.kt'
      - 'app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceRecognitionRetryGateContractTest.kt'
      - 'app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceAssistantControllerRobolectricTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    name: Sentinel Core / full regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested PR in restricted runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install locked parser without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript parser and shell hook
        run: |
          set -eu
          for file in .github/scripts/ultra_sentinel_*.cjs; do node --check "$file"; done
          sh -n .githooks/pre-commit
          sh -n .github/scripts/install_sentinel_hook.sh
      - name: Run all isolated engine and orchestrator tests
        env:
          CORE_MIN_TESTS: '150000'
        run: |
          set -euo pipefail
          # Capture high-volume TAP without flooding the GitHub logs.
          # On failure, print the first useful failing cases before exiting.
          if node --test .github/scripts/ultra_sentinel_*.test.cjs | tee "$RUNNER_TEMP/sentinel-core.tap" >/dev/null; then
            echo 'Node Core suite completed; validating TAP counters.'
          else
            echo 'Node Core tests failed. First failures:'
            grep -A 14 '^not ok ' "$RUNNER_TEMP/sentinel-core.tap" | head -n 160 || true
            tail -n 24 "$RUNNER_TEMP/sentinel-core.tap" || true
            exit 1
          fi
          node - "$RUNNER_TEMP/sentinel-core.tap" <<'NODE'
          const fs=require('node:fs');
          const tap=fs.readFileSync(process.argv[2],'utf8');
          const tests=Number([...tap.matchAll(/^# tests (\d+)$/gm)].at(-1)?.[1]||0);
          const failed=Number([...tap.matchAll(/^# fail (\d+)$/gm)].at(-1)?.[1]||-1);
          const skipped=Number([...tap.matchAll(/^# skipped (\d+)$/gm)].at(-1)?.[1]||-1);
          const floor=Number(process.env.CORE_MIN_TESTS);
          if(tests<floor||failed!==0||skipped!==0){
            console.error(`Sentinel Core invalid: tests=${tests}, floor=${floor}, fail=${failed}, skipped=${skipped}`);
            process.exit(1);
          }
          console.log(`Sentinel Core gate passed: ${tests} executed, zero failures/skips (minimum ${floor})`);
          NODE
      - name: Verify OMEGA abstract voice-state contracts
        run: |
          node .github/scripts/ultra_sentinel_omega.cjs
          node .github/scripts/ultra_sentinel_omega_access.cjs
      - name: Score labeled adversarial cases
        run: node .github/scripts/ultra_sentinel_benchmark.cjs
