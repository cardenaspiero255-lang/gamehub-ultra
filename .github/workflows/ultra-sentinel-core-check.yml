name: Ultra Sentinel Core Tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ultra_sentinel_*.cjs'
      - '.github/scripts/install_sentinel_hook.sh'
      - '.githooks/pre-commit'
      - '.github/workflows/ultra-sentinel-*.yml'
      - 'docs/ULTRA_SENTINEL_LOCAL.md'
      - '.github/sentinel-contracts/**'
      - '.github/sentinel-evidence-ledger.json'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceRecognitionRetryGate.kt'
      - 'app/src/main/java/com/cardenaspiero255/gamehubultra/voice/VoiceAssistantController.kt'
      - 'app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceRecognitionRetryGateContractTest.kt'
      - 'app/src/test/java/com/cardenaspiero255/gamehubultra/voice/VoiceAssistantControllerRobolectricTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    name: Sentinel Core / full regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout tested PR in restricted runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate JavaScript parser and shell hook
        run: |
          set -eu
          for file in .github/scripts/ultra_sentinel_*.cjs; do node --check "$file"; done
          sh -n .githooks/pre-commit
          sh -n .github/scripts/install_sentinel_hook.sh
      - name: Run all isolated engine and orchestrator tests
        run: node --test .github/scripts/ultra_sentinel_*.test.cjs
      - name: Verify OMEGA abstract voice-state contracts
        run: |
          node .github/scripts/ultra_sentinel_omega.cjs
          node .github/scripts/ultra_sentinel_omega_access.cjs
      - name: Score labeled adversarial cases
        run: node .github/scripts/ultra_sentinel_benchmark.cjs
