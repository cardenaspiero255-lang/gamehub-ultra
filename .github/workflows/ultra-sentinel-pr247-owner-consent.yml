name: CAR29 PR247 Sole-Maintainer Consent
run-name: CAR29-PR247-owner-${{ inputs.pr_head_sha }}

# Owner explicitly runs this once after reviewing the current SHA.
# No repository writes, auto-approval, auto-merge or external reviewer.
on:
  workflow_dispatch:
    inputs:
      pr_head_sha:
        description: "Full 40-character SHA of PR #247"
        required: true
        type: string
      confirm:
        description: "Enter exactly AUTORIZO-PR247-CAR29"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  owner-authorization:
    name: Authenticated owner consent for PR247 exact SHA
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'cardenaspiero255-lang' &&
      github.triggering_actor == 'cardenaspiero255-lang' &&
      github.actor_id == '322222186'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable trusted main only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate human owner and exact PR247 Git blobs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_ACTOR_ID: ${{ github.actor_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path=require('node:path');
            const scope=require(path.resolve('.github/scripts/ultra_sentinel_pr247_auth.cjs'));
            const owner=context.repo.owner,repo=context.repo.repo;
            const input=context.payload.inputs||{};
            const head=input.pr_head_sha;
            if(context.eventName!=='workflow_dispatch'||
               context.ref!=='refs/heads/main'||
               context.actor!=='cardenaspiero255-lang'||
               Number(process.env.EXPECTED_ACTOR_ID)!==322222186||
               !/^[a-f0-9]{40}$/.test(head||'')||
               input.confirm!=='AUTORIZO-PR247-CAR29'){
              core.setFailed('Owner-only explicit authorization missing');return;
            }
            const mainSha=context.sha;
            const getMain=async()=>((await github.rest.git.getRef({
              owner,repo,ref:'heads/main'})).data?.object?.sha);
            if(await getMain()!==mainSha){
              core.setFailed('Trusted main advanced before consent');return;
            }
            const args={owner,repo,pull_number:247,per_page:100};
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:247});
            const files=await github.paginate(github.rest.pulls.listFiles,args);
            if(pr.head?.sha!==head||!scope.isExactPr(pr,mainSha)||
               !scope.exactFiles(files)){
              core.setFailed('PR247 identity, SHA or files changed');return;
            }
            const mainBlob=(await github.rest.repos.getContent({
              owner,repo,path:'.github/workflows/sonar.yml',ref:mainSha})).data;
            const prBlob=(await github.rest.repos.getContent({
              owner,repo,path:'.github/workflows/sonar.yml',ref:head})).data;
            if(!scope.verifiedBlob(mainBlob,scope.BASE_BLOB)||
               !scope.verifiedBlob(prBlob,scope.HEAD_BLOB)){
              core.setFailed('Unreviewed Sonar workflow blob');return;
            }
            const {data:after}=await github.rest.pulls.get({owner,repo,pull_number:247});
            const afterFiles=await github.paginate(github.rest.pulls.listFiles,args);
            if(after.head.sha!==head||!scope.isExactPr(after,mainSha)||
               !scope.exactFiles(afterFiles)||await getMain()!==mainSha){
              core.setFailed('PR247 or main changed during owner consent');return;
            }
            core.notice('Authenticated owner workflow_dispatch for PR247 SHA '+head+
              '; no GitHub APPROVED review, CI waiver or auto-merge.');
            await core.summary.addHeading('CAR-29 sole-maintainer consent')
              .addRaw('Owner '+context.actor+'; PR247 SHA '+head+'; main '+mainSha+
                '. All protected checks remain mandatory.').write();
