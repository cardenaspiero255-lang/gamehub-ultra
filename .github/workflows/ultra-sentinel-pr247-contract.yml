name: CAR-29 PR247 Adversarial Authorization Tests
# Unprivileged PR tests. Never load SONAR_TOKEN or trusted-reviewer credentials.
on:
  push:
    branches: [security/car29-pr247-exact-manual-attestation-20261026]
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ultra_sentinel_pr247_auth*'
      - '.github/workflows/ultra-sentinel-pr247-contract.yml'
permissions:
  contents: read
jobs:
  exact-approval-contract:
    name: PR247 exact authenticated approval adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged test candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run exact SHA and human review adversarial suite
        run: node --test .github/scripts/ultra_sentinel_pr247_auth.test.cjs

      - name: Test exact full-source JS context with the Sentinel parser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs=require('node:fs');
          const acorn=require('acorn');
          const {findCapabilities}=require('./.github/scripts/ultra_sentinel_capabilities.cjs');
          const path='.github/scripts/ultra_sentinel_pr247_auth.cjs';
          const text=fs.readFileSync(path,'utf8');
          try {
            const ast=acorn.parse(text,{ecmaVersion:'latest',sourceType:'script',
              allowHashBang:true,allowReturnOutsideFunction:true,allowAwaitOutsideFunction:true,
              locations:true,ranges:true});
            const sinks=findCapabilities(ast);
            console.log('Full-source AST parsed; candidate sink count:',sinks.length);
          }catch(error){
            console.error('Full-source analysis failed:',error.message);
            process.exitCode=1;
          }
          NODE
