name: GameHub Ultra trusted Sentry SDK delivery E2E
# Never runs on pull_request, pull_request_target or untrusted code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentry-sdk-delivery-e2e.yml'
permissions:
  contents: read
concurrency:
  group: gamehub-sentry-trusted-e2e
  cancel-in-progress: false
jobs:
  sdk-delivery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.13'
      - name: Validate emulator boot and trusted workflow contract
        shell: bash
        run: python3 -m unittest tools/test_sentry_emulator_boot_contract.py tools/test_sentry_trusted_workflow.py -v
      - name: Build trusted Android app and opt-in instrumentation
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: gamehub-ultra@${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Boot isolated API35 emulator with verified Android CI configuration
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -e /dev/kvm ]; then
            echo "::error::Isolated Android emulator needs /dev/kvm on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          bash .github/scripts/install-android-runtime-sdk.sh
          IMAGE_DIR="$SDK_ROOT/system-images/android-35/google_apis/x86_64"
          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR_BIN"
          test -s "$IMAGE_DIR/system.img"
          test -s "$IMAGE_DIR/ramdisk.img"
          test -e "$IMAGE_DIR/data/empty_data_disk"
          AVD_HOME="$HOME/.android/avd"
          AVD_DIR="$AVD_HOME/gamehub-sentry-e2e.avd"
          AVD_INI="$AVD_HOME/gamehub-sentry-e2e.ini"
          unset ANDROID_EMULATOR_HOME ANDROID_AVD_HOME
          rm -rf "$AVD_DIR" "$AVD_INI"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_INI" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/gamehub-sentry-e2e.avd
          target=android-35
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=gamehub-sentry-e2e
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=gamehub-sentry-e2e
          disk.dataPartition.size=4G
          hw.audioInput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.ramSize=4096
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          target=android-35
          vm.heapSize=512
          EOF
          mkdir -p "$HOME/.android"
          : > "$HOME/.emulator_console_auth_token"
          "$EMULATOR_BIN" -list-avds | grep -Fxq gamehub-sentry-e2e
          adb start-server >/dev/null
          nohup "$EMULATOR_BIN" -avd gamehub-sentry-e2e \
            -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save \
            -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 4 \
            -camera-back none -camera-front none -netdelay none -netspeed full \
            > "$RUNNER_TEMP/sentry-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          sleep 2
          kill -0 "$EMULATOR_PID"
          timeout 300 adb wait-for-device
          timeout 600 bash -c '
            while true; do
              state="$(adb get-state 2>/dev/null || true)"
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
              if [ "$state" = "device" ] && [ "$boot" = "1" ]; then break; fi
              sleep 2
            done
          '
          kill -0 "$EMULATOR_PID"
          adb shell getprop ro.kernel.qemu | tr -d '\r' | grep -Fxq 1
          adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fxq 35
          test "$(adb devices | sed -n '/device$/p' | wc -l | tr -d ' ')" -eq 1
      - name: Capture controlled SDK event on Android
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -n 1)"
          test -n "$test_apk"
          adb install -r app/build/outputs/apk/debug/app-debug.apk >/dev/null
          adb install -r "$test_apk" >/dev/null
          adb logcat -c
          adb shell am instrument -w -e class com.cardenaspiero255.gamehubultra.SentryDeliveryE2ETest -e sentry_e2e true com.cardenaspiero255.gamehubultra.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/sentry-instrumentation.txt"
          grep -q '^OK (1 test)' "$RUNNER_TEMP/sentry-instrumentation.txt"
          adb logcat -d -s GHU_SENTRY_E2E:I '*:S' > "$RUNNER_TEMP/sentry-probe-only.txt"
          line="$(grep -E 'EVENT_ID=[a-f0-9]{32} RELEASE=gamehub-ultra@[a-f0-9]{40}' "$RUNNER_TEMP/sentry-probe-only.txt" | tail -n 1)"
          test -n "$line"
          expected_release="gamehub-ultra@${{ github.sha }}"
          printf '%s\n' "$line" | grep -Fq "RELEASE=$expected_release"
          event_id="$(printf '%s\n' "$line" | sed -nE 's/.*EVENT_ID=([a-f0-9]{32}) RELEASE=.*/\1/p')"
          test "${#event_id}" -eq 32
          echo "event_id=$event_id" >> "$GITHUB_OUTPUT"
      - name: Verify exact Sentry event and release from server
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_E2E_EVENT_ID: ${{ steps.capture.outputs.event_id }}
          SENTRY_RELEASE: gamehub-ultra@${{ github.sha }}
        shell: bash
        run: python3 tools/sentry_e2e_verify.py --org gamehub-ultra-1t --project gamehub-ultra
      - name: Sanitize emulator artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sentry-instrumentation.txt" "$RUNNER_TEMP/sentry-probe-only.txt"
