name: Supabase Edge Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-edge-tests.yml"

permissions:
  contents: read

concurrency:
  group: supabase-edge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.1.x

      - name: Check provider test formatting
        run: deno fmt --check supabase/functions/ultra-research/research_test.ts

      - name: Lint provider tests
        run: deno lint supabase/functions/ultra-research/research_test.ts

      - name: Test Edge Function
        run: deno test supabase/functions/ultra-research/research_test.ts
