name: CAR29 PR229 isolated post-upload regression
on:
  push:
    branches: [ci/car29-pr229-postupload-regression-20261024]
permissions:
  contents: read
jobs:
  guard-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable candidate without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b0a9b4ef4b2c6bc1ad6485ea4d227bb8351cdf58
          persist-credentials: false
      - name: Assert pinned HEAD then run post-upload regressions
        run: |
          test "$(git rev-parse HEAD)" = "b0a9b4ef4b2c6bc1ad6485ea4d227bb8351cdf58"
          node --test tools/test_pr221_postupload_guard.cjs
